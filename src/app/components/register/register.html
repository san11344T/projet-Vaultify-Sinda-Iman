<app-navbar></app-navbar>
<div class="min-h-screen bg-gray-50">


  <div class="pt-24 pb-16 px-4">
    <div class="mx-auto max-w-md">

      <!-- Logo + titolo -->
      <div class="text-center mb-8 animate-fade-in">
        <img src="vaultify-logo.png" alt="Vaultify" class="h-16 w-auto mx-auto mb-4" />
        <h1 class="text-3xl font-bold mb-2">Start your Vaultify journey</h1>
        <p class="text-gray-500">Your money vault awaits.</p>
      </div>

      <!-- Card -->
      <div class="bg-white rounded-xl shadow-lg p-6 animate-scale-in">
        <div class="mb-4">
          <h2 class="text-xl font-semibold mb-1">Create Account</h2>
          <p class="text-gray-400 text-sm">Join the future of digital banking</p>
        </div>

        <!-- Form -->
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">

          <!-- Full Name -->
          <div class="space-y-2">
            <label for="fullName" class="block text-sm font-medium text-gray-700">Full Name</label>
            <input
              id="fullName"
              placeholder="John Doe"
              formControlName="fullName"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <!-- Email -->
          <div class="space-y-2">
            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
            <input
              id="email"
              type="email"
              placeholder="john@example.com"
              formControlName="email"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <!-- Phone -->
          <div class="space-y-2">
            <label for="phone" class="block text-sm font-medium text-gray-700">Phone Number</label>
            <input
              id="phone"
              type="tel"
              placeholder="+33 6 12 34 56 78"
              formControlName="phone"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <!-- Password -->
          <div class="space-y-2">
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input
              id="password"
              type="password"
              placeholder="••••••••"
              formControlName="password"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <!-- Account Category -->
          <div class="space-y-2">
            <label for="category" class="block text-sm font-medium text-gray-700">Account Category</label>
            <select
              id="category"
              formControlName="category"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option value="" disabled>Select your category</option>
              <option value="student">Student (€100 bonus)</option>
              <option value="standard">Standard</option>
              <option value="premium">Premium</option>
            </select>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition"
          >
            Create my account
          </button>

          <!-- Login link -->
          <p class="text-center text-sm text-gray-500">
            Already have an account?
            <a routerLink="/login" class="text-blue-600 hover:underline font-medium">
              Log in
            </a>
          </p>

        </form>
      </div>

      <!-- Bonus Alert -->
      <div *ngIf="showBonus" class="fixed inset-0 flex items-center justify-center bg-black/40">
        <div class="bg-white rounded-xl p-6 max-w-md text-center animate-scale-in">
          <div class="mx-auto mb-4 w-16 h-16 rounded-full bg-yellow-100 flex items-center justify-center text-3xl">
            🎉
          </div>
          <h3 class="text-2xl font-bold mb-2">Welcome Bonus!</h3>
          <p class="text-gray-600 text-lg">
            Congratulations! You've received <span class="font-bold text-yellow-600">€100</span> as a student welcome bonus.
            Your account is being created...
          </p>
        </div>
      </div>

    </div>
  </div>
</div>
