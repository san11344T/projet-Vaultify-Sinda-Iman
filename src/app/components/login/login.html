<!-- login.component.html -->

<app-navbar></app-navbar>
<div class="min-h-screen bg-gray-50">

  <!-- Navbar (puoi usare il tuo componente app-navbar) -->
  <app-navbar></app-navbar>

  <div class="pt-24 pb-16 px-4">
    <div class="mx-auto max-w-md">

      <!-- Logo + titolo -->
      <div class="text-center mb-8 animate-fade-in">
        <img src="vaultify-logo.png" alt="Vaultify" class="h-16 w-auto mx-auto mb-4" />
        <h1 class="text-3xl font-bold mb-2">Welcome back</h1>
        <p class="text-gray-500">Log in to your secure vault</p>
      </div>

      <!-- Card -->
      <div class="bg-white rounded-xl shadow-lg p-6 animate-scale-in">
        <div class="mb-4">
          <h2 class="text-xl font-semibold mb-1">Log In</h2>
          <p class="text-gray-400 text-sm">Access your account securely</p>
        </div>

        <!-- Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">

          <!-- Email -->
          <div class="space-y-2">
            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
            <input
              id="email"
              type="email"
              placeholder="john@example.com"
              formControlName="email"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <!-- Password -->
          <div class="space-y-2">
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input
              id="password"
              type="password"
              placeholder="••••••••"
              formControlName="password"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <!-- Forgot password -->
          <button type="button" (click)="showRecovery = !showRecovery"
                  class="text-sm text-blue-600 hover:underline">
            Forgot password?
          </button>

          <!-- Password Recovery -->
          <div *ngIf="showRecovery" class="mt-4 p-4 border border-gray-200 rounded-lg bg-gray-50">
            <h3 class="font-semibold mb-1">Reset Your Password</h3>
            <p class="text-gray-500 text-sm mb-2">Enter your email and we'll send you a recovery link.</p>
            <form [formGroup]="recoveryForm" (ngSubmit)="onRecovery()" class="space-y-4">
              <div class="space-y-2">
                <label for="recoveryEmail" class="block text-sm font-medium text-gray-700">Email</label>
                <input
                  id="recoveryEmail"
                  type="email"
                  placeholder="john@example.com"
                  formControlName="recoveryEmail"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
              <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
                Send Recovery Email
              </button>
            </form>
          </div>

          <!-- Submit -->
          <button type="submit"
                  class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
            Log in securely
          </button>

          <!-- Signup link -->
          <p class="text-center text-sm text-gray-500">
            Don't have an account?
            <a routerLink="/register" class="text-blue-600 hover:underline font-medium">
              Create one now
            </a>
          </p>

        </form>
      </div>
    </div>
  </div>
</div>
